<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <a id="piholeLink" href="/admin/" class="pihole-link" title="Pi-hole Admin">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Pi-hole
            </a>
        </div>
        <div class="topbar-right" id="system-content">
            <span class="system-loading">Loading...</span>
        </div>
    </header>

    <div class="info-strip">
        <div class="info-clock">
            <span class="clock-time" id="clock-time">--:--</span>
            <span class="clock-sep">&middot;</span>
            <span class="clock-date" id="clock-date">---</span>
        </div>
        <div class="info-weather" id="weather-content">
            <span class="weather-loading">Loading...</span>
        </div>
    </div>

    <main class="dashboard">
        <section class="card card-notes" id="notes-card">
            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span>Notes</span>
                <button class="btn-add" id="add-note-btn" title="Add note">+</button>
            </div>
            <div class="notes-container" id="notes-container">
            </div>
        </section>

        <section class="card card-todo" id="todo-card">
            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                <span>To-Do</span>
            </div>
            <div class="todo-input-row">
                <input type="text" id="todo-input" placeholder="Add a task..." autocomplete="off">
                <button class="btn-add" id="add-todo-btn" title="Add task">+</button>
            </div>
            <ul class="todo-list" id="todo-list"></ul>
            <div class="todo-footer" id="todo-footer">
                <span id="todo-count">0 tasks</span>
                <button class="btn-clear" id="clear-completed-btn">Clear completed</button>
            </div>
        </section>
    </main>

    <script src="js/clock.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/system.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/todo.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
